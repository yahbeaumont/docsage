[project]
name = "docsage"
version = "0.3.0"
description = "Production RAG over technical docs with verified span citations and an eval suite"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "slowapi>=0.1.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "openai>=1.40",
  "qdrant-client>=1.9",
  "rank-bm25>=0.2.2",
  "sentence-transformers>=3.0",
  "tiktoken>=0.7",
  "tenacity>=8.3",
  "structlog>=24.1",
  "orjson>=3.10",
  "typer>=0.12",
  "rich>=13.7",
  "numpy>=1.26",
  "prometheus-client>=0.20",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
cohere = ["cohere>=5.5"]
tracing = ["langfuse>=3.0"]
dev = [
  "pytest>=8.2", "pytest-asyncio>=0.23", "pytest-cov>=5.0",
  "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7",
]

[project.scripts]
docsage = "docsage.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docsage"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S"]
# S101: asserts são o mecanismo dos testes. B008: padrão de assinatura do Typer.
# RUF001/2/3: textos em português usam acentos e símbolos (±, σ, −, –).
# S311: o RNG é de bootstrap estatístico, não de criptografia.
# S324: sha1 identifica chunk de documento, não protege segredo.
# S301: o pickle é do próprio índice BM25 gerado localmente.
# S603: subprocess chama `git` com argumentos fixos do repositório do corpus.
# ASYNC230/240: leitura de JSON pequeno dentro de corrotinas de avaliação.
ignore = [
    "S101", "B008", "RUF001", "RUF002", "RUF003",
    "S311", "S324", "S301", "S603", "ASYNC230", "ASYNC240",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --cov=docsage --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
source = ["src/docsage"]
omit = ["*/eval/ab.py", "*/eval/run_eval.py", "*/calibrate.py"]
