services:
  ollama:
    image: ollama/ollama:0.4.2
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.11.3
    ports: ["6333:6333"]
    volumes: ["./data/qdrant_storage:/qdrant/storage:z"]

  api:
    build: .
    env_file: .env.local
    environment:
      OPENAI_BASE_URL: http://ollama:11434/v1
      LLM_PROVIDER: ollama
      QDRANT_URL: http://qdrant:6333
    ports: ["8000:8000"]
    depends_on: [ollama, qdrant]

volumes:
  ollama:
